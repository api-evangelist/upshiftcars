name: Upshift
description: Upshift is a San Francisco fractional car subscription service — "a 2-car garage,
  in your pocket." Members choose 4, 8, or 12 driving days a month and get a premium Toyota
  hybrid delivered clean, fueled, insured, and maintained, then picked up when they are done,
  with plans from $399/month including insurance, delivery, and maintenance. A 500 Global and
  URBAN-X portfolio company, Upshift publishes no public developer program or API surface; the
  member experience runs through its iOS/Android apps and go.upshiftcars.com.
